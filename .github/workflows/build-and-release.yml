name: Build and Release Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release?"
        required: false
        type: boolean
        default: false
      tag_name:
        description: "Release tag (optional, e.g. v0.2.1. Leave blank to use package.json version)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Uran
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and package zip
        run: npm run package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uran-plugin
          path: Uran.zip

  release:
    name: Publish Uran package
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release == true)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Uran-plugin
          path: release-package

      - name: Attach zip to published Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-package/Uran.zip

      - name: Create Release and Upload Asset (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || format('v{0}', needs.build.outputs.version) }}
          files: release-package/Uran.zip
          generate_release_notes: true

      - name: Send notification to Discord
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG_INPUT: ${{ inputs.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping Discord notification."
            exit 0
          fi

          if [ "$EVENT_NAME" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            NAME="${{ github.event.release.name }}"
            URL="${{ github.event.release.html_url }}"
            BODY="${{ github.event.release.body }}"
          else
            TAG="${TAG_INPUT:-v${VERSION}}"
            NAME="Uran ${TAG}"
            URL="${SERVER_URL}/${REPOSITORY}/releases/tag/${TAG}"
            BODY="Uran ${TAG} package ready for Decky Loader."
          fi

          TITLE="New release: ${NAME:-$TAG}"
          DESC="$(echo "$BODY" | head -c 1500)"

          jq -n \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg desc "$DESC" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 5814783}]}' \
          | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK" || echo "Failed to post to Discord webhook"
